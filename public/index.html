  <body>

    <main class="landing" hidden>
      <h1 class="sr-only">Juegos de Scratch de 4°</h1>
      <div class="hats" role="group" aria-label="Elegí tu grado">
        <button class="block hat pick" type="button" data-g="4N">4N</button>
        <button class="block hat pick" type="button" data-g="4F">4F</button>
        <button class="block hat pick" type="button" data-g="4S">4S</button>
      </div>
    </main>

    <main class="board" hidden>
      <header class="top">
        <div class="palette" role="group" aria-label="Cambiar de grado">
          <button class="chip" type="button" data-g="4N" aria-pressed="false">4N</button>
          <button class="chip" type="button" data-g="4F" aria-pressed="false">4F</button>
          <button class="chip" type="button" data-g="4S" aria-pressed="false">4S</button>
        </div>

        <div class="script">
          <div class="stack">
            <h1 class="block hat head" tabindex="-1">
              <span class="sr-only">Juegos de </span><span class="hat-label"></span>
            </h1>
            <form class="block cmd add" novalidate>
              <span class="lead" aria-hidden="true">
                <svg class="icon"><use href="#i-link" /></svg>
                <img class="peek" alt="" width="144" height="108" hidden />
              </span>
              <input
                class="slot"
                type="text"
                name="url"
                inputmode="url"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Pegá el link de tu juego"
                aria-label="Link de tu juego"
              />
              <button class="go" type="submit" aria-label="Agregar juego">
                <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
              </button>
            </form>
          </div>

          <div class="say" hidden>
            <svg class="icon stop" aria-hidden="true"><use href="#i-stop" /></svg>
            <p class="say-text" id="say-text"></p>
          </div>
        </div>
      </header>

      <section class="games" aria-label="Juegos" aria-busy="false">
        <ul class="grid" role="list"></ul>
      </section>
    </main>

    <p class="sr-only" role="status" aria-live="polite" id="live"></p>
  </body>
</html>
