    <main class="gate" hidden>
      <h1 class="sr-only">Panel de juegos</h1>
      <div class="gate-script">
        <form class="block cmd tool login" novalidate>
          <svg class="icon lock" aria-hidden="true"><use href="#i-lock" /></svg>
          <input
            class="slot"
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Contraseña"
            aria-label="Contraseña"
            required
          />
          <button class="enter" type="submit">Entrar</button>
        </form>
      </div>
    </main>

    <main class="panel" hidden>
      <header class="bar">
        <h1 class="block hat tool head" tabindex="-1">Panel<span class="sr-only"> de juegos</span></h1>
        <button class="out" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-out" /></svg>
          Salir
        </button>
      </header>

      <div class="filters" role="group" aria-label="Mostrar">
        <button class="filter" type="button" data-f="all" aria-pressed="true">
          <span class="label">Todos</span><span class="dot all"><span class="count">0</span></span>
        </button>
        <button class="filter" type="button" data-f="4N" aria-pressed="false">
          <span class="label">4N</span><span class="dot" data-g="4N"><span class="count">0</span></span>
        </button>
        <button class="filter" type="button" data-f="4F" aria-pressed="false">
          <span class="label">4F</span><span class="dot" data-g="4F"><span class="count">0</span></span>
        </button>
        <button class="filter" type="button" data-f="4S" aria-pressed="false">
          <span class="label">4S</span><span class="dot" data-g="4S"><span class="count">0</span></span>
        </button>
      </div>

      <section class="sheet" aria-label="Juegos" aria-busy="false">
        <ul class="rows" role="list"></ul>
        <p class="nothing" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-tray" /></svg>
          <span class="nothing-text"></span>
        </p>
      </section>
    </main>

    <div class="say" hidden>
      <svg class="icon stop" aria-hidden="true"><use href="#i-stop" /></svg>
      <p class="say-text" id="say-text"></p>
    </div>

    <p class="sr-only" role="status" aria-live="polite" id="live"></p>
  </body>
