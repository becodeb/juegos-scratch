    <main class="gate" hidden>
      <h1 class="sr-only">Panel de juegos</h1>
      <div class="gate-script">
        <form class="block cmd tool login" novalidate>
          <svg class="icon lock" aria-hidden="true"><use href="#i-lock" /></svg>
          <input
            class="slot"
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Contraseña"
            aria-label="Contraseña"
            required
          />
          <button class="enter" type="submit">Entrar</button>
        </form>
      </div>
    </main>

    <main class="panel" hidden>
      <header class="bar">
        <div class="heading">
          <a class="up" href="/admin" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-back" /></svg>
            Proyectos
          </a>
          <h1 class="block hat tool head" tabindex="-1"><span class="head-label">Panel</span></h1>
        </div>
        <button class="out" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-out" /></svg>
          Salir
        </button>
      </header>

      <section class="projects-view" aria-label="Proyectos" hidden>
        <form class="block cmd tool maker" novalidate>
          <svg class="icon maker-icon" aria-hidden="true"><use href="#i-plus" /></svg>
          <div class="yearpick" role="group" aria-label="Año del proyecto nuevo">
            <button class="ybtn" type="button" data-y="3" aria-pressed="false">3°</button>
            <button class="ybtn" type="button" data-y="4" aria-pressed="true">4°</button>
          </div>
          <input
            class="slot maker-title"
            type="text"
            maxlength="60"
            autocomplete="off"
            placeholder="Nuevo proyecto"
            aria-label="Nombre del proyecto nuevo"
          />
          <label class="slug-slot">
            <span class="slug-slash" aria-hidden="true">/</span>
            <input
              class="maker-slug"
              type="text"
              maxlength="40"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="direccion"
              aria-label="Dirección del proyecto nuevo"
            />
          </label>
          <button class="enter" type="submit">Crear</button>
        </form>

        <div class="yfilter" role="group" aria-label="Mostrar proyectos de">
          <button class="yf" type="button" data-y="all" aria-pressed="true">Todos</button>
          <button class="yf" type="button" data-y="3" aria-pressed="false">3°</button>
          <button class="yf" type="button" data-y="4" aria-pressed="false">4°</button>
        </div>

        <section class="sheet" aria-busy="false">
          <ul class="rows plist" role="list"></ul>
          <p class="nothing" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-tray" /></svg>
            <span class="nothing-text">Todavía no hay proyectos.</span>
          </p>
        </section>
      </section>

      <section class="games-view" hidden>
        <div class="filters" role="group" aria-label="Mostrar">
          <button class="filter" type="button" data-f="all" aria-pressed="true">
            <span class="label">Todos</span><span class="dot all"><span class="count">0</span></span>
          </button>
          <button class="filter" type="button" data-f="4N" aria-pressed="false">
            <span class="label">4N</span><span class="dot" data-g="4N"><span class="count">0</span></span>
          </button>
          <button class="filter" type="button" data-f="4F" aria-pressed="false">
            <span class="label">4F</span><span class="dot" data-g="4F"><span class="count">0</span></span>
          </button>
          <button class="filter" type="button" data-f="4S" aria-pressed="false">
            <span class="label">4S</span><span class="dot" data-g="4S"><span class="count">0</span></span>
          </button>
        </div>

        <section class="sheet" aria-label="Juegos" aria-busy="false">
          <ul class="rows glist" role="list"></ul>
          <p class="nothing" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-tray" /></svg>
            <span class="nothing-text"></span>
          </p>
        </section>
      </section>
    </main>

    <div class="say" hidden>
      <svg class="icon stop" aria-hidden="true"><use href="#i-stop" /></svg>
      <svg class="icon hint" aria-hidden="true"><use href="#i-info" /></svg>
      <p class="say-text" id="say-text"></p>
    </div>

    <p class="sr-only" role="status" aria-live="polite" id="live"></p>
  </body>
</html>
